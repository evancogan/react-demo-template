name: PR description

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  description:
    runs-on: ubuntu-26.04
    steps:
      # Only for reading the pull request template, from the base branch, so a
      # pull request that edits the template can't change what's checked.
      # Nothing from the repo is run.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check the description follows the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          errors=0
          body=$(printf '%s\n' "$PR_BODY" | tr -d '\r')
          template=.github/pull_request_template.md

          if ! printf '%s\n' "$body" | grep -Eq '^Closes #[0-9]+'; then
            echo "::error::The description needs a line like 'Closes #12'."
            errors=1
          fi

          for heading in '## What changed' '## Review checklist'; do
            if ! printf '%s\n' "$body" | grep -Fxq "$heading"; then
              echo "::error::The description is missing the heading '$heading'."
              errors=1
            fi
          done

          # Every checklist item in the template must appear, ticked or not,
          # with its wording unchanged. A reason in parentheses may follow it.
          items=$(tr -d '\r' < "$template" | grep -E '^- \[ \] ' | sed -E 's/^- \[ \] //')
          if [ -z "$items" ]; then
            echo "::error::$template on the base branch has no checklist items."
            errors=1
          fi
          checklist=$(printf '%s\n' "$body" | grep -E '^- \[[ xX]\] ' | sed -E 's/^- \[[ xX]\] //')
          missing=0
          while IFS= read -r item; do
            [ -n "$item" ] || continue
            if ! printf '%s\n' "$checklist" | awk -v item="$item" 'index($0, item) == 1 { found = 1 } END { exit !found }'; then
              missing=$((missing + 1))
            fi
          done <<< "$items"
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing of the template's checklist items are missing or reworded. Copy them from $template."
            errors=1
          fi

          unreasoned=$(printf '%s\n' "$body" | grep -E '^- \[ \] ' | grep -Evc '\([^()]+\)[[:space:]]*$' || true)
          if [ "$unreasoned" -gt 0 ]; then
            echo "::error::$unreasoned unticked checklist item(s) have no reason in parentheses at the end of the line."
            errors=1
          fi

          exit "$errors"

      - name: Check templates only change when the issue asks
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          templates=$(printf '%s\n' "$changed" | grep -E '^\.github/(pull_request_template\.md$|ISSUE_TEMPLATE/)' || true)
          if [ -z "$templates" ]; then
            echo "No template files changed."
            exit 0
          fi

          issue=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -Eo '^Closes #[0-9]+' | head -n 1 | tr -dc '0-9')
          if [ -z "$issue" ]; then
            echo "::error::This pull request changes template files, so it needs a 'Closes #N' line whose issue lists them under 'Where'."
            exit 1
          fi

          # The issue's "Where" section: from its heading to the next heading.
          where=$(gh api "repos/$GH_REPO/issues/$issue" --jq '.body // ""' | tr -d '\r' |
            awk '/^## / { inside = ($0 == "## Where"); next } inside')

          errors=0
          while IFS= read -r file; do
            if ! printf '%s\n' "$where" | grep -Fq "$file"; then
              echo "::error file=$file::Templates are read-only. Issue #$issue's 'Where' doesn't list $file, so this pull request may not change it."
              errors=1
            fi
          done <<< "$templates"
          exit "$errors"
