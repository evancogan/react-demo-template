name: Issue description

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  task-template:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check task issues follow the template
        id: validate
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          body_file="$RUNNER_TEMP/issue-body.md"
          template=.github/ISSUE_TEMPLATE/task.md
          printf '%s\n' "$ISSUE_BODY" | tr -d '\r' > "$body_file"

          # Bug issues use a different template and are validated separately.
          if grep -Fxq '## Steps to reproduce' "$body_file"; then
            echo "Bug issue detected; skipping task template validation."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          errors=0
          previous_line=0
          for heading in '## What' '## Where' '## Done when' '## Constraints'; do
            line=$(grep -n -F -x "$heading" "$body_file" | head -n 1 | cut -d: -f1 || true)
            if [ -z "$line" ]; then
              echo "::error::The issue is missing the heading '$heading'."
              errors=1
            elif [ "$line" -le "$previous_line" ]; then
              echo "::error::The issue headings are not in the same order as $template."
              errors=1
            else
              previous_line=$line
            fi
          done

          items=$(grep -E '^- \[ \] ' "$template" | sed -E 's/^- \[ \] //')
          if [ -z "$items" ]; then
            echo "::error::$template has no checklist items."
            errors=1
          fi

          checklist=$(grep -E '^- \[[ xX]\] ' "$body_file" | sed -E 's/^- \[[ xX]\] //')
          missing=0
          while IFS= read -r item; do
            [ -n "$item" ] || continue
            if ! printf '%s\n' "$checklist" |
              awk -v item="$item" 'index($0, item) == 1 { found = 1 } END { exit !found }'; then
              missing=$((missing + 1))
            fi
          done <<< "$items"

          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing of the task template checklist items are missing or reworded."
            errors=1
          fi

          if [ "$errors" -eq 0 ]; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
          exit "$errors"

      - name: Update the issue validation comment
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ steps.validate.outputs.result }}
        with:
          script: |
            const marker = '<!-- task-template-validation -->';
            const result = process.env.VALIDATION_RESULT || 'failed';
            const details = {
              passed: ['✅', 'passed', 'The issue matches `.github/ISSUE_TEMPLATE/task.md`.'],
              failed: ['❌', 'failed', 'The issue does not match `.github/ISSUE_TEMPLATE/task.md`. See the workflow errors for details.'],
              skipped: ['ℹ️', 'skipped', 'This issue uses the bug template, so task-template validation was skipped.'],
            }[result] || ['❌', 'failed', 'The validation did not produce a recognized result.'];
            const [icon, status, message] = details;
            const body = [
              marker,
              `### ${icon} Task-template validation ${status}`,
              '',
              message,
              '',
              `[View the workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if task validation failed
        if: ${{ steps.validate.outputs.result == 'failed' }}
        run: exit 1
